<script>
button.disabled=true;

function calculateFare() {
    const basefare=2;
    const button= document.getElementById('button')
    const discount= document.getElementById('Discount').value;
    const startkm = document.getElementById('StartSelect').value;
    const endkm = document.getElementById('EndSelect').value;

    if (startkm ==="bzzt") { alert("Select a valid starting point!"); return;}
    if (endkm ==="bzzt") { alert("Select a valid ending point!"); return;}
    if (discount ==="bzzt") { alert("Select a valid option!"); return;}
    if (startkm === endkm) { alert("Your starting and ending point can't be the same!"); return;}

    const totaldistance = Math.abs(endkm - startkm);
    const rateperkm = 0.5;
    const prediscount= totaldistance * rateperkm + basefare;
    const fare = prediscount * discount;

    if (fare>0) { button.disabled=false; }

    document.getElementById('fareDisplay').textContent = 
    "Your fare is: " + fare + " euros! *ੈ✩‧₊˚(˶˃⤙˂˶)‧₊˚*✩";
}
</script>

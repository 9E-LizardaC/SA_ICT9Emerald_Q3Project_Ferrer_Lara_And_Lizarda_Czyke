    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTNfhRw5loG2wlB8pL2-gnI4lGP9-geODd9Gw&s"
    id="main-instruc">   
    </div>
    <br>
    <br>
        <button class="prev-instruc" onclick="LastInstruction()"> Previous Instructions</button>
        <button onclick="NextInstruction()"> Next Instructions</button>

    </section>

    <script>
    
    var currentinstruction =0;
    const savedimages = [
        'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTNfhRw5loG2wlB8pL2-gnI4lGP9-geODd9Gw&s',
        'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS1GLEu5zu3jvQp1QtYr1RksvqAVg3rJWG_Dg&s',
        'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTFYqoKTu_o3Zns2yExbst2Co84Gpc2Q1RJbA&s'
    ];
    
    const maininstruc = document.getElementById('main-instruc');

    function showInstruction() {
        maininstruc.src = savedimages[currentinstruction];
    }

    function NextInstruction() {
        if (currentinstruction < savedimages.length - 1) {
            currentinstruction++;
            showInstruction();
        }
     }
     
     function LastInstruction() {
        if (currentinstruction>0) {
            currentinstruction--;
            showInstruction();
        }

     }

     showInstruction();
     

    </script>

</body>
